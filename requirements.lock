# Exact versions, captured with `pip freeze` from the running production
# container — a set known to work together, not a guess.
#
# Why a lock file at all: this server's PyPI connection drops partway through
# large downloads. Resolving `requirements.txt`'s open ranges makes pip walk
# hundreds of candidate versions, fetching metadata for each, and a single
# dropped request turns into a misleading pandas/numpy "ResolutionImpossible"
# after ~8 minutes of backtracking. Pinning removes the search entirely: pip
# downloads exactly these files, once.
#
# requirements.txt stays the human-readable list of direct dependencies.
# Regenerate this file deliberately, with:
#   docker exec my-safar-bot pip freeze > requirements.lock
