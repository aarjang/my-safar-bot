services:
  web:
    build: .
    image: my-safar-bot:latest
    container_name: my-safar-bot
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8765}:8765"
    environment:
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      # bcrypt hash, not the plaintext password — see .env.example for how to
      # generate one. If unset, the app falls back to auto-generating a local
      # credentials file and printing the password once to the container logs.
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
      DASHBOARD_CORS_ORIGINS: ${DASHBOARD_CORS_ORIGINS:-}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      # mount your own config over the example if you have route/rate-limit
      # customizations: - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8765),timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
