services:
  web:
    build: .
    image: my-safar-bot:latest
    container_name: my-safar-bot
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8765}:8765"
    # env_file (not `environment: ${VAR}`) on purpose: docker-compose's own
    # ${VAR} interpolation re-parses substituted values for $-syntax, which
    # mangles a bcrypt hash (its $2b$12$... delimiters look like more
    # variable references to compose). env_file loads .env's KEY=VALUE lines
    # into the container as-is, with no second interpolation pass.
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      # mount your own config over the example if you have route/rate-limit
      # customizations: - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8765),timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
